repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check --force-exclude
        language: system
        types: [python]
      - id: tracked-secret-patterns
        name: Tracked secret patterns
        entry: python tools/scan_tracked_secrets.py
        language: system
        pass_filenames: false
        always_run: true
