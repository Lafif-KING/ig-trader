[tool.poetry]
name = "ig-trader"
version = "0.1.0"
description = ""
authors = ["Afif afif.benkheder@outlook.com"]
readme = "README.md"
packages = [{ include = "ig_trader", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13"
pydantic-settings = "^2.15.0"
python-dotenv = "^1.2.2"
httpx = "^0.28.1"
structlog = "^26.1.0"
pandas = "^3.0.5"
numpy = "^2.5.1"
ta = "^0.11.0"
sqlalchemy = "^2.0.51"
lightstreamer-client-lib = "^2.2.2"
truststore = "^0.10.4"
azure-identity = ">=1.25,<2.0"
psycopg = {version = ">=3.2,<4.0", extras = ["binary"]}

[tool.poetry.group.dev.dependencies]
ruff = "0.15.0"
black = ">=26.5.1,<27.0.0"
isort = ">=8.0.1,<9.0.0"
pre-commit = ">=4.6.1,<5.0.0"
pytest = ">=9.1.1,<10.0.0"
mypy = ">=2.3.0,<3.0.0"
respx = "^0.23.1"
pytest-asyncio = "^1.4.0"

[tool.poetry.group.dashboard]
optional = true

[tool.poetry.group.dashboard.dependencies]
streamlit = "1.61.1"
httpx = "^0.28.1"
jsonschema = "^4.26.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
