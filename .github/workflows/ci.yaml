name: Cloud foundation CI

on:
  push:
    branches: ["main", "codex/g4a-01-cloud-foundation", "codex/g4b-02a1-operational-alerts", "codex/g4b-02b1-execution-lease", "codex/g4b-02b2a-db-bootstrap"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-scan-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.14"

      - name: Install exact Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1

      - name: Verify and install locked dependencies
        run: |
          mkdir -p artifacts/ci
          poetry check --lock
          poetry sync --no-interaction --no-ansi
          poetry run pip check

      - name: Collect and run complete clean suite
        run: |
          poetry run pytest --collect-only -q | tee artifacts/ci/test-collection.txt
          poetry run pytest -q --junitxml=artifacts/ci/tests-complete.xml

      - name: G1 focused tests
        run: poetry run pytest -q --junitxml=artifacts/ci/tests-g1.xml tests/test_ig_auth_diagnostic.py

      - name: G2 focused tests
        run: poetry run pytest -q --junitxml=artifacts/ci/tests-g2.xml tests/test_g2_offline_paper.py

      - name: G3A focused tests
        run: |
          poetry run pytest -q \
            --junitxml=artifacts/ci/tests-g3a.xml \
            tests/test_g3a_market_data.py \
            tests/test_g3a_gap_recovery.py

      - name: G3B focused tests
        run: |
          poetry run pytest -q \
            --junitxml=artifacts/ci/tests-g3b.xml \
            tests/test_g3b_replay.py

      - name: G4A focused tests
        run: |
          poetry run pytest -q \
            --junitxml=artifacts/ci/tests-g4a.xml \
            tests/test_cloud_runtime.py \
            tests/test_cloud_foundation_contracts.py \
            tests/test_g4b_c2_stage_isolation.py

      - name: G4B operations focused tests
        run: |
          poetry run pytest -q \
            --junitxml=artifacts/ci/tests-g4b-ops.xml \
            tests/test_g4b_ops_monitoring.py

      - name: G4B execution lease unit tests
        run: |
          poetry run pytest -q \
            --junitxml=artifacts/ci/tests-g4b-lease-unit.xml \
            tests/test_execution_lease.py

      - name: G4B database bootstrap unit tests
        run: |
          poetry run pytest -q \
            --junitxml=artifacts/ci/tests-g4b-db-bootstrap.xml \
            -k "not real_postgresql" \
            tests/test_g4b_db_bootstrap.py

      - name: G4B real PostgreSQL bootstrap proof
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: |
          timeout --signal=TERM --kill-after=10s 60s poetry run pytest -q \
            --junitxml=artifacts/ci/tests-g4b-db-bootstrap-postgres.xml \
            tests/test_g4b_db_bootstrap.py::test_real_postgresql_blank_bootstrap_applies_and_verifies_both_migrations

      - name: G4B PostgreSQL fencing proof
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: |
          timeout --signal=TERM --kill-after=10s 60s poetry run pytest -q \
            --junitxml=artifacts/ci/tests-g4b-lease-fencing.xml \
            tests/test_execution_lease.py::test_postgresql_rejects_unfenced_and_stale_state_changes

      - name: G4B PostgreSQL two-process handoff proof
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: |
          timeout --signal=TERM --kill-after=10s 60s poetry run pytest -q \
            --junitxml=artifacts/ci/tests-g4b-lease-concurrency.xml \
            tests/test_execution_lease.py::test_two_processes_elect_one_leader_then_handoff_after_leader_crash

      - name: Ruff
        run: poetry run ruff check .

      - name: Formatting
        run: poetry run ruff format --check .

      - name: Repository pre-commit hooks
        run: poetry run pre-commit run --all-files

      - name: Validate Azure Bicep
        env:
          AZURE_ALERT_EMAIL: project-operator@example.invalid
        run: |
          az bicep install --version v0.45.15
          az bicep lint --file infra/azure/foundation.bicep
          az bicep lint --file infra/azure/app.bicep
          az bicep lint --file infra/azure/dev-shadow-c2.bicep
          az bicep lint --file infra/azure/dev-shadow-foundation.bicep
          az bicep lint --file infra/azure/dev-shadow-app.bicep
          az bicep lint --file infra/azure/dev-shadow-ops.bicep
          az bicep lint --file infra/azure/dev-shadow-db-bootstrap.bicep
          az bicep build --file infra/azure/foundation.bicep --outfile artifacts/ci/foundation.json
          az bicep build --file infra/azure/app.bicep --outfile artifacts/ci/app.json
          az bicep build --file infra/azure/dev-shadow-c2.bicep --outfile artifacts/ci/dev-shadow-c2.json
          az bicep build --file infra/azure/dev-shadow-foundation.bicep --outfile artifacts/ci/dev-shadow-foundation.json
          az bicep build --file infra/azure/dev-shadow-app.bicep --outfile artifacts/ci/dev-shadow-app.json
          az bicep build --file infra/azure/dev-shadow-ops.bicep --outfile artifacts/ci/dev-shadow-ops.json
          az bicep build --file infra/azure/dev-shadow-db-bootstrap.bicep --outfile artifacts/ci/dev-shadow-db-bootstrap.json
          az bicep build-params \
            --file infra/azure/foundation.parameters.example.bicepparam \
            --outfile artifacts/ci/foundation.parameters.json
          az bicep build-params \
            --file infra/azure/app.parameters.example.bicepparam \
            --outfile artifacts/ci/app.parameters.json
          az bicep build-params \
            --file infra/azure/dev-shadow-foundation.parameters.example.bicepparam \
            --outfile artifacts/ci/dev-shadow-foundation.parameters.json
          az bicep build-params \
            --file infra/azure/dev-shadow-app.parameters.example.bicepparam \
            --outfile artifacts/ci/dev-shadow-app.parameters.json
          az bicep build-params \
            --file infra/azure/dev-shadow-c2.parameters.bicepparam \
            --outfile artifacts/ci/dev-shadow-c2.parameters.json
          az bicep build-params \
            --file infra/azure/dev-shadow-ops.parameters.bicepparam \
            --outfile artifacts/ci/dev-shadow-ops.parameters.json
          az bicep build-params \
            --file infra/azure/dev-shadow-db-bootstrap.parameters.bicepparam \
            --outfile artifacts/ci/dev-shadow-db-bootstrap.parameters.json
          printf '{"compiler":"bicep-v0.45.15","parameter_files":7,"status":"pass"}\n' \
            > artifacts/ci/bicep-result.json

      - name: Secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          poetry run python tools/scan_tracked_secrets.py
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks dir --no-banner --redact --exit-code 1 .
          printf '{"gitleaks":"pass","tracked_source_scan":"pass"}\n' \
            > artifacts/ci/secret-scan.json

      - name: Build commit-addressed image
        env:
          BASE_IMAGE: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
          IMAGE: ig-trader:${{ github.sha }}
        run: |
          docker pull "${BASE_IMAGE}"
          docker build \
            --build-arg "APP_COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "APP_SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "APP_VERSION=0.1.0" \
            --tag "${IMAGE}" \
            .

      - name: Build database bootstrap image
        env:
          BASE_IMAGE: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
          IMAGE: ig-trader-db-bootstrap:${{ github.sha }}
        run: |
          docker build \
            --file Dockerfile.db-bootstrap \
            --build-arg "APP_COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "APP_SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "APP_VERSION=0.1.0" \
            --tag "${IMAGE}" \
            .

      - name: Safe container acceptance test
        env:
          IMAGE: ig-trader:${{ github.sha }}
        run: |
          poetry run python tools/g4a_container_smoke.py \
            --image "${IMAGE}" \
            --expected-commit "${GITHUB_SHA}" \
            --evidence artifacts/ci/container-smoke.json

      - name: Inspect image identity and contents
        env:
          BASE_IMAGE: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
          IMAGE: ig-trader:${{ github.sha }}
        run: |
          poetry run python tools/g4a_image_inspect.py \
            --image "${IMAGE}" \
            --expected-base "${BASE_IMAGE}" \
            --expected-commit "${GITHUB_SHA}" \
            --evidence artifacts/ci/image-inspection.json
          sha256sum Dockerfile Dockerfile.db-bootstrap poetry.lock \
            migrations/postgresql/001_execution_state.sql \
            migrations/postgresql/002_execution_lease_fencing.sql \
            migrations/postgresql/003_shadow_position_state.sql \
            > artifacts/ci/build-inputs.sha256

      - name: Inspect database bootstrap image and safe CLI
        env:
          BASE_IMAGE: python:3.13.14-slim-bookworm@sha256:9d7f287598e1a5a978c015ee176d8216435aaf335ed69ac3c38dd1bbb10e8d64
          IMAGE: ig-trader-db-bootstrap:${{ github.sha }}
        run: |
          poetry run python tools/g4b_db_bootstrap_image_inspect.py \
            --image "${IMAGE}" \
            --expected-base "${BASE_IMAGE}" \
            --expected-commit "${GITHUB_SHA}" \
            --evidence artifacts/ci/db-bootstrap-image-inspection.json
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            "${IMAGE}" --help > artifacts/ci/db-bootstrap-cli-help.txt

      - name: Build compact remote CI evidence
        run: poetry run python tools/g4a_ci_evidence.py --artifact-directory artifacts/ci

      - name: Upload immutable build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-foundation-${{ github.sha }}
          path: artifacts/ci
          if-no-files-found: error
          retention-days: 30
