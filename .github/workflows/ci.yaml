CI on: push: branches: [ "main" ] pull_request: branches: [ "main" ] jobs: build: runs-on: windows-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: "3.13" - name: Install Poetry run: | setx POETRY_HOME "%USERPROFILE%\poetry" (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python - echo "%USERPROFILE%\poetry\venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append - name: Show versions run: | python -V poetry --version - name: Install deps run: poetry install - name: Lint (ruff) run: | poetry run ruff check . poetry run ruff format --check . - name: Format checks (black, isort) run: | poetry run black --check . poetry run isort --check-only . - name: Tests run: poetry run pytest -q